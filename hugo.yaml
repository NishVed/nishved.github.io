baseURL: https://nishved.github.io/

title: Nishanth Veduruvada — AI, Security & Systems Architect
theme: PaperMod

pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Nishanth Veduruvada
  description: "Nishanth Veduruvada — AI, Security & Systems Architect. I design secure, production-grade AI systems: agentic AI, enterprise RAG, AI governance and Zero Trust architecture. Also decoding music, one song at a time."
  keywords:
    - AI Architect
    - Security Architect
    - Systems Architect
    - Zero Trust
    - Agentic AI
    - Enterprise AI
    - RAG
    - MCP
    - AI Governance
    - Music Analysis
  author: Nishanth Veduruvada
  # Keeps the header wordmark short while the <title> tag carries the full role for SEO.
  label:
    text: "Nishanth Veduruvada"
  DateFormat: "January 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  # Sections that feed the writing feed / RSS
  mainSections: ["writing"]

  # --- Identity, used by the custom homepage layout ---
  identity:
    name: "Nishanth Veduruvada"
    short: "Nish"
    role: "AI, Security & Systems Architect"
    eyebrow: "Portfolio / 2026"
    thesis: "I architect enterprise AI systems the way I'd architect a security perimeter: assume nothing, verify everything."
    summary: >
      Currently AI Engineer Advisor at NTT DATA, leading AI modernization architecture across the
      Syntphony product ecosystem. Previously designed the Zero Trust and AI governance
      architecture behind a national-scale insurance data platform: work that became a
      registered design.
    curiosity: >
      Beyond Listening started as a music series. It turned out to be the name for how I approach
      most things — get past the surface of something, work out what is actually happening
      underneath, then build it or explain it. The architecture above is the same habit, pointed
      at systems instead of songs.

  # Favicon / tab icon: a black-and-white head crop of the Van Gogh-exhibit
  # portrait. Regenerate with `python3 tools/make-favicon.py` after changing
  # assets/img/portrait.jpg -- the icons need a far harder levels curve than
  # the on-page portrait, because a dim photograph of a face reads as a grey
  # smudge at 16px without it.
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.v2.png"
    favicon32x32: "/favicon-32x32.v2.png"
    apple_touch_icon: "/apple-touch-icon.v2.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"

  # Downloadable CV, surfaced as a button in the homepage hero.
  cv:
    file: "/Nishanth-Veduruvada-CV.pdf"
    label: "Download CV"

  socialIcons:
    - name: github
      url: "https://github.com/NishVed"
    - name: linkedin
      url: "https://linkedin.com/in/nish-ved"
    - name: email
      url: "mailto:nishanth.themaster@gmail.com"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: work
      name: Architecture
      url: /work/
      weight: 10
    - identifier: writing
      name: Writing
      url: /writing/
      weight: 20
    - identifier: beyond-listening
      name: Beyond Listening
      url: /beyond-listening/
      weight: 30
    - identifier: explore
      name: Explore
      url: /explore/
      weight: 40
    - identifier: about
      name: About
      url: /about/
      weight: 50

taxonomies:
  tag: tags

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
