baseURL: https://nishved.github.io/

title: Nishanth Veduruvada
theme: PaperMod

pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # enables opengraph, twitter-cards and schema
  title: Nishanth Veduruvada — Zero Trust AI
  description: "Nishanth Veduruvada — AI Engineer Advisor at NTT DATA. I architect enterprise AI systems under Zero Trust principles: agentic AI, RAG, AI governance, and enterprise integration."
  keywords: [Zero Trust AI, Enterprise AI Architecture, Agentic AI, AI Governance, MCP, RAG, Zero Trust Architecture]
  author: Nishanth Veduruvada
  DateFormat: "January 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  mainSections: ["writing"]

  # home-info mode — the homepage hero
  homeInfoParams:
    Title: "Nishanth Veduruvada"
    Content: >
      **Zero Trust AI.** I architect enterprise AI systems the way I'd architect a security
      perimeter: assume nothing, verify everything.


      Currently AI Engineer Advisor at NTT DATA, leading architecture across 8–10 enterprise AI
      modernization programs. Previously built the Zero Trust framework behind a national-scale
      insurance data platform — work that's now a registered design and a published paper.


      [Work](/work/) · [Writing](/writing/) · [Publications & IP](/publications/) · [Now](/now/) · [About](/about/)

  socialIcons:
    - name: github
      url: "https://github.com/NishVed"
    - name: linkedin
      url: "https://linkedin.com/in/nish-ved"
    - name: email
      url: "mailto:nishanth.themaster@gmail.com"

  # for search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: writing
      name: Writing
      url: /writing/
      weight: 10
    - identifier: work
      name: Work
      url: /work/
      weight: 20
    - identifier: publications
      name: Publications
      url: /publications/
      weight: 30
    - identifier: now
      name: Now
      url: /now/
      weight: 40
    - identifier: about
      name: About
      url: /about/
      weight: 50

# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
